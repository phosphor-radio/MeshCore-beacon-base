[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-base"
version = "0.1.0"
description = "Base station software for the MeshCore beacon tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",  # the FastAPI test client
]

[project.scripts]
beaconctl = "beacon_base.cli:main"
beacon-ingest = "beacon_base.service:main"
beacon-web = "beacon_base.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beacon_base = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: builds and runs the container image; needs Docker and BEACON_DOCKER_TESTS=1 (see tests/test_docker.py)"]
