<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beacon map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%232b7a4b'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%232b7a4b' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<header class="top">
  <h1>Beacon map</h1>
  <div id="status" class="status" aria-live="polite"></div>
  <div id="updated" class="updated" title="Time since the page last heard from the base"></div>
</header>

<div id="banners" class="banners"></div>

<main class="layout">
  <section class="mapwrap" aria-label="Map">
    <div id="map"></div>
    <div id="empty" class="empty" hidden>No located repeaters or beacon positions yet.</div>
    <div class="mapbuttons">
      <button type="button" id="fit" title="Fit the map to the repeaters and beacons">Fit</button>
      <label class="check"><input type="checkbox" id="labels" checked> Labels</label>
    </div>
  </section>

  <aside class="panel" aria-label="Beacons and repeaters">
    <section>
      <h2>Beacons <span id="beacon-count" class="count"></span></h2>
      <ul id="beacons" class="list"></ul>
    </section>
    <section id="detail" class="detail" hidden></section>
    <section>
      <h2>Repeaters <span id="repeater-count" class="count"></span></h2>
      <ul id="repeaters" class="list"></ul>
    </section>
    <p id="unknown" class="note"></p>
    <p id="mapnote" class="note"></p>
  </aside>
</main>

<dialog id="token-dialog">
  <form method="dialog" id="token-form">
    <h2 id="token-title">Operator token</h2>
    <p id="token-text">Resetting a beacon needs the operator token (<code>beaconctl web token show</code>). It is kept only until this tab is closed.</p>
    <input id="token-input" type="password" autocomplete="off" spellcheck="false" aria-labelledby="token-title" required>
    <p id="token-error" class="error" hidden></p>
    <div class="actions">
      <button value="cancel" type="button" id="token-cancel">Cancel</button>
      <button value="ok" type="submit" class="primary">Continue</button>
    </div>
  </form>
</dialog>

<dialog id="confirm-dialog">
  <form method="dialog" id="confirm-form">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="actions">
      <button value="cancel" type="button" id="confirm-cancel">Cancel</button>
      <button value="ok" type="submit" class="danger" id="confirm-ok">Reset</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="static/vendor/leaflet/leaflet.js"></script>
<script src="static/app.js"></script>
</body>
</html>
