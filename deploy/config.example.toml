# beacon-base configuration. Copy to ~/.config/beacon-base/config.toml (or point $BEACON_BASE_CONFIG / -c at it).
#
# Secrets (the report channel key) are NOT kept here. 'beaconctl channel generate' writes them to secrets.toml in the
# same directory with mode 0600. Never commit that file.
# secrets_file = "secrets.toml"

[companion]
# Use the stable by-id path, ttyACM numbers move. List candidates with: ls -l /dev/serial/by-id
port = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_XX:XX:XX:XX:XX:XX-if00"
baud = 115200
# DTR when opening the port. "auto" holds it low for Espressif's native USB (ESP32-S3 can reset otherwise) and raises it for
# anything else (an nRF52 only transmits while DTR is high), retrying once the other way if the companion does not answer;
# "on" / "off" force it. See docs/operations.md.
dtr = "auto"

# Channel slot on the companion that carries the beacon reports. Slot 0 holds the built-in Public channel.
channel_index = 1
channel_name = "beacon-reports"

# Apply [radio] (radio parameters and path hash mode) to the companion on connect, so any companion can be used without a
# special firmware image. Each is written only when it differs, since the companion keeps them in flash. When false, a
# mismatch is only logged as a warning.
manage_radio = true

# Take each repeater's position and name from the adverts the companion hears (repeaters advertise them; nothing is typed in).
learn_repeaters = true
# Run the base companion in manual-add mode, so it stores no contacts and every advert reaches the base in full with its
# position. This is saved in the companion; set false to leave the companion's own setting alone.
manual_add_contacts = true
# Move the companion's clock forward to the base's once the base's clock is trusted (beaconctl time set|confirm, or
# clock.assume_synced). Never backward and never from an untrusted clock; held in RAM, not flash. Needed for logging in to
# repeaters (remote management), which reject timestamps older than ones they have seen.
sync_clock = true

# Safety-net queue drain, in seconds, in case a "messages waiting" notification is missed.
poll_interval = 30
command_timeout = 5

# Remote repeater management over the mesh ('beaconctl repeater remote', docs/plan/repeater-remote.md). A step waits for the
# companion's estimate of the round trip times timeout_factor, kept between the two limits. A step is tried up to three times: again
# on the same route, then after resetting the route and logging in again. A job running longer than max_job_s is failed.
[remote]
min_timeout_s = 8
max_timeout_s = 30
timeout_factor = 1.5
max_job_s = 180
# Pacing: nothing is transmitted until this many seconds after the last thing received (a login answer, a reply, a late reply) or
# after a timeout, so the repeaters' rebroadcasts of the last reply have died down before the next command goes out. 0 turns it off.
step_gap_s = 3

# Radio settings shared by every device in the mesh (beacons, repeaters, base).
[radio]
freq_khz = 905775
bw_hz = 62500
sf = 8
cr = 6      # 6 means coding rate 4/6
path_hash_mode = 2   # 0-2: path hashes of 1-3 bytes in the packets a device floods; kept the same across the mesh

[database]
# SQLite file shared by ingest, the CLI and (later) the web UI. Relative paths are relative to this file's directory.
path = "beacon.db"

[beacon]
# Expected beacon transmit interval (seconds, +/-10% jitter). Used to decide when a beacon is "silent" and to check that
# repeater report windows stay below the shortest interval (see 'beaconctl check').
interval_s = 300
silent_intervals = 3

[clock]
# The Pi has no internet in the field, so its clock is set by hand ('beaconctl time set'). Set this to true on a machine
# whose clock is already right (NTP, RTC), such as the development machine, to trust observation times without that.
assume_synced = false

[service]
# Exit if the session loop makes no progress for this many seconds, so a supervisor (Docker's restart policy, systemd) restarts a hung
# beacon-ingest. A crash is restarted by the supervisor anyway; this covers a hang. 0 is off, which suits a terminal run or a debugger.
# The container image sets BEACON_WATCHDOG_S=120, which takes precedence over this.
watchdog_s = 0

[estimate]
# The placeholder location estimator that gives each transmission a position (docs/web.md): a circle around the one repeater that heard
# it, or a weighted centroid when two or more did. Real estimation is later; these two numbers set how far away a given RSSI is taken to
# be, so tune them from a walk test. After changing them, 'beaconctl positions rebuild' estimates the stored transmissions again.
tx_power_dbm = 22          # the beacon's effective radiated power: transmit power plus antenna gain, less cable loss
path_loss_exponent = 2.7   # 2 is free space; open ground with people about is nearer 2.5-3
min_radius_m = 25          # no estimate is drawn tighter than this
max_radius_m = 5000

[web]
# beacon-web, the map and API (docs/web.md). It listens on this machine only unless you say otherwise: other machines reading it is a
# choice, and the page is plain HTTP, so the operator token (beaconctl web token generate) then crosses the network in clear.
host = "127.0.0.1"
port = 8080
# Map tiles, from a raster MBTiles file (relative paths are relative to this file). With none the map is a plain grid with coordinates.
# The Pi has no internet at the event, so tiles are made beforehand; see docs/web.md.
tiles = ""
# The credit shown in the map's corner for the tiles file (HTML). Empty uses the file's own `attribution` metadata. Tiles made from OpenStreetMap
# data must credit it, e.g. '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' (docs/map-tiles.md).
tiles_attribution = ""
# DEVELOPMENT ONLY: a tile URL template used when there is no tiles file, for a machine that has internet. The page then sends a Referer
# to the tile server and shows its attribution. OpenStreetMap's public server (https://tile.openstreetmap.org/{z}/{x}/{y}.png) has a
# usage policy (https://operations.osmfoundation.org/policies/tiles/): interactive viewing only, no bulk downloads, no tile archives.
# Leave empty in the field.
online_tile_url = ""
# The credit shown for online tiles (HTML). Empty gives OpenStreetMap's for its own servers and none for any other.
online_tile_attribution = ""
