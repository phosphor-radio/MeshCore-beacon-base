# Docker Compose file for the base station on a Raspberry Pi. See docs/deployment.md.
#
#   docker load -i image-<arch>.tar        # once (load-image.sh picks the right file)
#   docker compose up -d                   # starts ingest (the companion) and web (the map)
#   ./beaconctl status                     # beaconctl runs inside the ingest container
#
# Everything the base needs to keep (configuration, secrets, database) is in ./data. For a new event, stop the stack and move ./data away.

name: beacon-base

services:
  ingest:
    image: beacon-base:${BEACON_VERSION:-latest}
    restart: unless-stopped
    init: true
    # Run as the login user, so the files in ./data belong to you. Set these in .env if your ids are not 1000.
    user: "${BEACON_UID:-1000}:${BEACON_GID:-1000}"
    group_add:
      - "${BEACON_TTY_GID:-20}"   # the group that owns /dev/ttyACM* (dialout is 20 on Raspberry Pi OS)
    environment:
      TZ: "${TZ:-UTC}"
      BEACON_WATCHDOG_S: "120"    # exit if the session loop stalls; Docker then restarts the container
    volumes:
      - ./data:/data
      # The host's /dev, so a companion that is unplugged and plugged in again is found again without restarting the container. It is mounted
      # at /hostdev rather than over /dev so the container keeps its own /dev/pts (docker exec -it needs it); set companion.port to
      # /hostdev/serial/by-id/usb-... in the configuration.
      - /dev:/hostdev:ro
      - /etc/localtime:/etc/localtime:ro
    device_cgroup_rules:
      - "c 166:* rmw"   # ttyACM
      - "c 188:* rmw"   # ttyUSB
    mem_limit: 256m       # a Pi Zero 2 W has 512 MB; a leak is killed and restarted rather than starving the Pi
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "beaconctl", "health", "--companion"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The map and API (docs/web.md). The same image as ingest, with the command "web". It needs only ./data (the database to read, a reset to write,
  # the configuration, the secrets and the tiles file), not the serial device. It does not depend on ingest: the map says when ingest is down.
  web:
    image: beacon-base:${BEACON_VERSION:-latest}
    command: ["web"]
    restart: unless-stopped
    init: true
    user: "${BEACON_UID:-1000}:${BEACON_GID:-1000}"
    environment:
      TZ: "${TZ:-UTC}"
    ports:
      # Published on every interface by default, so a laptop or phone on the network can open it; set BEACON_WEB_BIND=127.0.0.1 in .env to keep
      # it to the Pi. The page is plain HTTP, so the operator token (./beaconctl web token generate) crosses the network in clear.
      - "${BEACON_WEB_BIND:-0.0.0.0}:${BEACON_WEB_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    mem_limit: 128m       # needs the memory cgroup on the Pi (cgroup_enable=memory cgroup_memory=1 in /boot/firmware/cmdline.txt)
    stop_grace_period: 10s
    healthcheck:
      # no curl in the image: ask the API from inside with Python
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
